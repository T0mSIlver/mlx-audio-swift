# Verification only (not for merge): Nemotron Unified Swift session-contract tests with MLX on Metal.
name: Verify Nemotron Unified tests

on:
  push:
    branches:
      - 'verify-tests/**'

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest }
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: >-
          xcodebuild build-for-testing -scheme MLXAudio-Package -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Session contract and Nemotron tests (MLX runtime)
        env:
          MLXAUDIO_ENABLE_MLX_RUNTIME_TESTS: '1'
        run: >-
          xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -only-testing:'MLXAudioTests/NemotronUnifiedSessionContractTests'
          -only-testing:'MLXAudioTests/NemotronASRTests'
          MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
