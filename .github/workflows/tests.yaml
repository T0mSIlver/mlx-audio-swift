# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: xcodebuild build-for-testing -scheme MLXAudio-Package -destination 'platform=macOS' MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
      - name: Run tests
        timeout-minutes: 30
        run: |
          ( while true; do echo "MEM $(date +%T) $(memory_pressure | tail -1) swap: $(sysctl -n vm.swapusage)"; sleep 15; done ) &
          for i in 1 2 3; do
            xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/sparkTTSGeneratesAudio()' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test |MEM|error" || true
          done
