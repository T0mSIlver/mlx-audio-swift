# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: xcodebuild build-for-testing -scheme MLXAudio-Package -destination 'platform=macOS' MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
      - name: jsonParseNoPool
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/jsonParseNoPool()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: jsonParseInPool
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/jsonParseInPool()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: tokenizerAsync
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/tokenizerAsync()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: configLoadOnly
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/configLoadOnly()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: constructNoPool
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/constructNoPool()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: constructInPool
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/constructInPool()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
      - name: fullLoad
        run: TEST_RUNNER_MLXAUDIO_LEAK_283=1 xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -only-testing:'MLXAudioTests/Qwen3ASRLeakBisect/fullLoad()' CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E 'LEAK283|error:|✘' || true
